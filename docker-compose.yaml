services:
  connection-tester:
    build: .
    # If you'd rather pull a prebuilt image than build in Coolify, comment out
    # "build: ." above and set "image:" to your registry image instead.
    restart: unless-stopped
    environment:
      # --- required ---
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      # --- optional (defaults shown) ---
      TZ: ${TZ:-UTC}
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-5}
      CHECK_TIMEOUT: ${CHECK_TIMEOUT:-1.5}
      FAIL_THRESHOLD: ${FAIL_THRESHOLD:-3}
      TARGETS: ${TARGETS:-1.1.1.1:443,8.8.8.8:53}
      STARTUP_PING: ${STARTUP_PING:-true}
      # --- post-recovery speed test (hardcoded; no Coolify vars needed) ---
      # Measures ping, download and upload when the link returns and sends the
      # result as a second Telegram message, so a recovery on the slow 4G backup
      # is obvious. NOTE: with 100 MB download + 20 MB upload each recovery uses
      # ~120 MB -- lower SPEED_TEST_BYTES / SPEED_TEST_UPLOAD_BYTES if your 4G
      # backup is on a metered plan.
      SPEED_TEST: "true"
      SPEED_TEST_URL: "https://speed.cloudflare.com/__down?bytes=100000000"
      SPEED_TEST_BYTES: "100000000"       # 100 MB download
      SPEED_TEST_TIMEOUT: "120"
      SPEED_TEST_PING: "true"
      SPEED_TEST_PING_HOST: "1.1.1.1:443"
      SPEED_TEST_UPLOAD: "true"
      SPEED_TEST_UPLOAD_BYTES: "20000000" # 20 MB upload
      # Fibre line ~500+ Mbps, so anything under 100 Mbps is almost certainly
      # the 4G backup -- flag it. Bump this up if you ever want a stricter check.
      SPEED_TEST_SLOW_MBPS: "100"
      # Reply to commands you message the bot: /speedtest, /status, /help.
      LISTEN_COMMANDS: "true"
    volumes:
      - tester-data:/data

volumes:
  tester-data:
